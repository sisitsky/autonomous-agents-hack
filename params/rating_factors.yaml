# Multiplicative rating factors. ILLUSTRATIVE relativities set by judgment.
# Each factor lists the perils it applies to, so it only moves the risks it affects.
# Measured model behavior is NOT a factor here: it enters directly through
# red-team test counts (the Dirichlet failure rates), and counting it twice would
# double-charge. Changes to this file go through a pull request only.

version: 1.1.0

factors:
  use_case_criticality:
    applies_to: [wrong_information, unauthorized_commitment, bias_discrimination, unsafe_advice]
    levels: {low: 0.6, medium: 1.0, high: 1.8, critical: 3.0}
    source: Consequence of a wrong output (internal drafting vs. credit, hiring, medical).

  autonomy:
    controllable: true   # the insured can change this; quote reports show the saving
    applies_to: [wrong_information, unauthorized_commitment, prompt_injection, bias_discrimination, unsafe_advice,
                 autonomous_action_harm]
    levels: {advisory_human_signoff: 0.7, human_review_sampled: 0.85, autonomous: 1.0, autonomous_actions: 1.5}
    source: Human review catches errors before they reach customers; tool-using agents amplify injection.

  governance:
    controllable: true   # the insured can change this; quote reports show the saving
    applies_to: [wrong_information, unauthorized_commitment, data_leakage, prompt_injection,
                 bias_discrimination, ip_infringement, harmful_content, unsafe_advice, autonomous_action_harm]
    levels: {strong: 0.85, adequate: 1.0, weak: 1.2}
    source: Monitoring, logging, incident response, NIST AI RMF / ISO 42001 alignment.

  data_sensitivity:
    controllable: true   # the insured can change this; quote reports show the saving
    applies_to: [data_leakage, prompt_injection]
    levels: {none: 0.3, personal: 1.0, financial_or_health: 1.6}
    source: Sensitive data in prompts, context, or outputs.

  jurisdiction:
    applies_to: [data_leakage, bias_discrimination, unsafe_advice]
    levels: {us_low_reg: 0.9, us_high_reg: 1.2, eu: 1.4}
    source: EU AI Act high-risk categories; state AI and privacy laws.

  customer_facing:
    applies_to: [wrong_information, unauthorized_commitment, ip_infringement, harmful_content]
    levels: {internal: 0.5, public: 1.0}
    source: Public outputs create third-party exposure.

  vendor_indemnity:
    controllable: true   # the insured can change this; quote reports show the saving
    applies_to: [ip_infringement]
    levels: {none: 1.0, provider_ip_indemnity: 0.6}
    source: Model provider contractually indemnifies IP claims.

  deployment_scale:
    post_cap: true
    applies_to: [bias_discrimination, ip_infringement, harmful_content, unsafe_advice, autonomous_action_harm]
    levels: {small: 1.0, large: 2.0, very_large: 4.0, frontier: 8.0}
    source: >-
      Judgment (illustrative), 2026-11-23. Profile-priced perils use an annual claim rate set for a single
      deployment; a system serving far more users or outputs faces proportionally more claims, but
      sublinearly (shared controls, one defense). Bands by outputs per year: small < 10M, large 10M-1B,
      very_large 1B-100B, frontier >= 100B or a general-purpose model sold to many deployers.
      Red-team-measured perils already scale with outputs_per_year and are not listed.

# Underwriter adjustments (from answered open questions) are one relativity per peril,
# bounded here, recorded with a reason, and applied only to that insured.
underwriter_adjustment_bounds: {min: 0.5, max: 1.5}

# Combined modifier per peril is capped to stop stacked factors producing extreme prices.
# (Factors marked post_cap, like deployment_scale, apply after this cap: size is exposure,
# not a stacked risk judgment.)
combined_modifier_bounds: {min: 0.5, max: 3.0}

# Shock events: a material incident disclosed after intake (a breach, a lawsuit, a
# regulator's action, a safety failure), whether or not it answers an open question.
# Each event raises the claim frequency of the perils it bears on by its severity
# multiplier, applied after the combined cap and capped in total per peril. Severe or
# critical events also refer the quote to a human underwriter. Insured-specific: the
# portfolio priors only move through Loop 2.
shock_events:
  severity: {elevated: 1.3, severe: 2.0, critical: 3.5}
  max_total: 6.0
  refer_at: [severe, critical]
  source: >-
    Judgment (illustrative), 2026-11-23. Analog: cyber and E&O carriers surcharge or refer after a
    disclosed incident; a critical event (repeated unauthorized access to third parties, a
    systemic safety failure) roughly triples to quadruples expected frequency until remediated.

# Red-team signals for profile-priced perils: scope, content, advice, bias and IP tests
# move those perils' frequency by a credibility-weighted relativity,
#   rel = 1 + Z (r / baseline - 1),  Z = n / (n + credibility_k),  clipped to bounds,
# where r is the observed failure rate on n cases for that peril.
red_team_signals:
  credibility_k: 20
  baseline_failure_rate: {bias_discrimination: 0.10, ip_infringement: 0.10, harmful_content: 0.10,
                          unsafe_advice: 0.10, autonomous_action_harm: 0.10}
  bounds: {min: 0.7, max: 2.5}
  source: >-
    Judgment (illustrative), 2026-11-23. Baseline is the failure rate implied by the peril's annual
    rate for an average system; 20 cases of credibility so a handful of tests moves price modestly.
