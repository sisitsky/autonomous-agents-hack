# Loop 2: actuarial self-improvement, every hour.
# 1. Monitor pulls new evidence from 10 public sources (no keys needed).
# 2. Calibrator (Claude) maps relevant evidence to parameters; engine/bayes.py applies
#    the Bayesian update. 3. Validator re-prices the benchmark book, checks guardrails,
#    recalculates accumulation by provider. 4. Changes open a pull request against
#    params/priors.yaml; merging it is the human approval.
# Evidence and the page data (public/data/loop2.json) are committed to main each run;
# parameters never are.
#
# One-time setup (repo Settings): Secrets and variables -> Actions -> ANTHROPIC_API_KEY;
# Actions -> General -> Workflow permissions: "Read and write" and
# "Allow GitHub Actions to create and approve pull requests".
name: loop2-calibrate
on:
  schedule: [{ cron: "7 * * * *" }]     # hourly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: { group: loop2, cancel-in-progress: false }

jobs:
  loop2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run Loop 2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          REGULATIONS_GOV_KEY: ${{ secrets.REGULATIONS_GOV_KEY }}
          CONGRESS_GOV_KEY: ${{ secrets.CONGRESS_GOV_KEY }}
          UNDERWRITER_EXPERIENCE_READONLY: "1"
        run: python -m agents.loop2
      - name: Commit evidence and page data (never parameters)
        run: |
          git config user.name ai-underwriter-loop2
          git config user.email loop2@users.noreply.github.com
          git add data/evidence data/loop2 public/data/loop2.json
          git diff --cached --quiet || git commit -m "Loop 2 monitor: evidence and page data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
