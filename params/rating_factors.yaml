# Multiplicative rating factors. ILLUSTRATIVE relativities set by judgment.
# Each factor lists the perils it applies to, so it only moves the risks it affects.
# Measured model behavior is NOT a factor here: it enters directly through
# red-team test counts (the Dirichlet failure rates), and counting it twice would
# double-charge. Changes to this file go through a pull request only.

version: 1.0.0

factors:
  use_case_criticality:
    applies_to: [wrong_information, unauthorized_commitment, bias_discrimination, unsafe_advice]
    levels: {low: 0.6, medium: 1.0, high: 1.8, critical: 3.0}
    source: Consequence of a wrong output (internal drafting vs. credit, hiring, medical).

  autonomy:
    controllable: true   # the insured can change this; quote reports show the saving
    applies_to: [wrong_information, unauthorized_commitment, prompt_injection, bias_discrimination, unsafe_advice]
    levels: {advisory_human_signoff: 0.7, human_review_sampled: 0.85, autonomous: 1.0, autonomous_actions: 1.5}
    source: Human review catches errors before they reach customers; tool-using agents amplify injection.

  governance:
    controllable: true   # the insured can change this; quote reports show the saving
    applies_to: [wrong_information, unauthorized_commitment, data_leakage, prompt_injection,
                 bias_discrimination, ip_infringement, harmful_content, unsafe_advice]
    levels: {strong: 0.85, adequate: 1.0, weak: 1.2}
    source: Monitoring, logging, incident response, NIST AI RMF / ISO 42001 alignment.

  data_sensitivity:
    controllable: true   # the insured can change this; quote reports show the saving
    applies_to: [data_leakage, prompt_injection]
    levels: {none: 0.3, personal: 1.0, financial_or_health: 1.6}
    source: Sensitive data in prompts, context, or outputs.

  jurisdiction:
    applies_to: [data_leakage, bias_discrimination, unsafe_advice]
    levels: {us_low_reg: 0.9, us_high_reg: 1.2, eu: 1.4}
    source: EU AI Act high-risk categories; state AI and privacy laws.

  customer_facing:
    applies_to: [wrong_information, unauthorized_commitment, ip_infringement, harmful_content]
    levels: {internal: 0.5, public: 1.0}
    source: Public outputs create third-party exposure.

  vendor_indemnity:
    controllable: true   # the insured can change this; quote reports show the saving
    applies_to: [ip_infringement]
    levels: {none: 1.0, provider_ip_indemnity: 0.6}
    source: Model provider contractually indemnifies IP claims.

# Underwriter adjustments (from answered open questions) are one relativity per peril,
# bounded here, recorded with a reason, and applied only to that insured.
underwriter_adjustment_bounds: {min: 0.5, max: 1.5}

# Combined modifier per peril is capped to stop stacked factors producing extreme prices.
combined_modifier_bounds: {min: 0.5, max: 3.0}
