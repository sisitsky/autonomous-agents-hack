# Prior assumptions for the AI liability pricing engine.
# ALL VALUES ARE ILLUSTRATIVE. Changes to this file go through a pull request only.
#
# Any numeric parameter may be either a plain number (treated as known) or a
# distribution spec, which the engine samples to capture parameter uncertainty:
#   {dist: beta,      alpha: a, beta: b}            probabilities from test counts
#   {dist: pert,      min: x, mode: y, max: z}       expert three-point estimates
#   {dist: lognormal, median: m, p90: q}             positive, skewed quantities
#   {dist: uniform,   min: x, max: z}
#
# Every parameter carries a `source` note so reviewers can see where it came from.
#
# Model 1.0 (2026-11-22): eight AI-pitfall perils. Four are measured by red-team
# testing: each test case ends in a pass or exactly one failure type, so the
# failure-type rates are a Dirichlet, with a Jewell credibility prior estimated
# from the portfolio (engine/credibility.py). Four are priced from the risk
# profile through rating factors. Calibrated so a typical tested customer-facing
# bot lands near a 1-2% rate on line, in the range of SME tech E&O and cyber
# pricing; severities reflect that most chatbot harms are small and the expensive
# cases are rare group claims and regulatory actions. Judgment, illustrative.

version: 1.1.2
updated: '2026-11-22'

# ---------------------------------------------------------------- red-team measured perils
# frequency mode red_team:
#   claims/yr = outputs_per_year x theta[failure_type] x adversarial_to_live
#               x p_harm_given_failure x p_claim_given_harm
# theta ~ Dirichlet over test outcomes (pass + the failure types below).

red_team:
  failure_types: [wrong_information, unauthorized_commitment, data_leakage, prompt_injection]
  adversarial_to_live:
    dist: pert
    min: 0.002
    mode: 0.006
    max: 0.02
    source: >-
      Judgment (illustrative), 2026-11-22. Adversarial suites over-sample failure
      modes; roughly 6 in 1,000 live outputs face a comparable situation. Replace with
      paired adversarial vs. live-sample test data as it accumulates.
  # Used only when the portfolio has too little experience for Jewell estimation.
  fallback_prior:
    concentration: 10
    mean: {pass: 0.80, wrong_information: 0.05, unauthorized_commitment: 0.05, data_leakage: 0.05, prompt_injection: 0.05}
    source: Weak judgmental prior (illustrative), worth 10 test cases.

perils:
  wrong_information:
    description: The AI states something materially wrong (a hallucinated fact, a wrong policy, price, or eligibility) and a customer relies on it.
    frequency:
      mode: red_team
      failure_type: wrong_information
      exposure_field: outputs_per_year
      p_harm_given_failure: {dist: pert, min: 0.01, mode: 0.04, max: 0.10, source: "Share of wrong answers a customer acts on to their cost (illustrative)."}
      p_claim_given_harm: {dist: pert, min: 0.0005, mode: 0.002, max: 0.008, source: "Share of harmed customers who complain, demand, or sue (illustrative; consumer-claim analog)."}
    severity:
      body:
        dist: lognormal
        median: {dist: pert, min: 1000, mode: 2500, max: 6000, source: "Individual consumer loss from relying on a wrong answer (illustrative)."}
        p90: {dist: pert, min: 8000, mode: 20000, max: 50000, source: "Illustrative."}
      tail:
        prob: {dist: pert, min: 0.002, mode: 0.008, max: 0.02, source: "Share of claims that become group or class claims (illustrative)."}
        threshold: 150000
        alpha: {dist: pert, min: 1.6, mode: 2.2, max: 3.0, source: "Pareto shape of group claims; lower = fatter tail (illustrative)."}

  unauthorized_commitment:
    description: The AI promises a refund, credit, discount, price, or exception it is not authorized to give, and the company must honor it or defend a claim.
    frequency:
      mode: red_team
      failure_type: unauthorized_commitment
      exposure_field: outputs_per_year
      p_harm_given_failure: {dist: pert, min: 0.05, mode: 0.15, max: 0.30, source: "Share of unauthorized promises a customer tries to enforce (illustrative)."}
      p_claim_given_harm: {dist: pert, min: 0.0005, mode: 0.002, max: 0.006, source: "Share escalating to a covered third-party claim; honoring a promise is the insured's own cost and is not a claim (illustrative; Moffatt v. Air Canada analog)."}
    severity:
      body:
        dist: lognormal
        median: {dist: pert, min: 400, mode: 1200, max: 3000, source: "Value of an enforced promise plus handling (illustrative)."}
        p90: {dist: pert, min: 4000, mode: 9000, max: 25000, source: "Illustrative."}
      tail:
        prob: {dist: pert, min: 0.0005196, mode: 0.002078, max: 0.006235, source: "Share becoming group claims over a systematic promise (illustrative). Updated 2026-11-22 by calibration 20261122-222415: manual 'A (fictional) state appellate court held a retailer liable for refund promises' (moderate), mode 0.002 → 0.002078."}
        threshold: 100000
        alpha: {dist: pert, min: 1.8, mode: 2.4, max: 3.2, source: "Illustrative."}

  data_leakage:
    description: The AI discloses personal data (another customer's details, internal records) without authorization, leading to a privacy claim or regulatory action.
    frequency:
      mode: red_team
      failure_type: data_leakage
      exposure_field: outputs_per_year
      p_harm_given_failure: {dist: pert, min: 0.05, mode: 0.15, max: 0.35, source: "Share of leaking outputs that expose real personal data to a third party (illustrative)."}
      p_claim_given_harm: {dist: pert, min: 0.0001, mode: 0.0003, max: 0.001, source: "Share of exposures leading to a claim or regulator inquiry (illustrative; cyber analog: most single-record exposures never produce one)."}
    severity:
      body:
        dist: lognormal
        median: {dist: pert, min: 5000, mode: 15000, max: 40000, source: "Individual privacy claim incl. defense (illustrative)."}
        p90: {dist: pert, min: 40000, mode: 100000, max: 250000, source: "Illustrative."}
      tail:
        prob: {dist: pert, min: 0.005, mode: 0.015, max: 0.04, source: "Share becoming regulatory actions or class claims (illustrative)."}
        threshold: 400000
        alpha: {dist: pert, min: 1.4, mode: 1.9, max: 2.6, source: "Illustrative."}

  prompt_injection:
    description: Instructions hidden in user or third-party content take over the AI, causing unauthorized actions, data exfiltration, or fraud.
    frequency:
      mode: red_team
      failure_type: prompt_injection
      exposure_field: outputs_per_year
      p_harm_given_failure: {dist: pert, min: 0.002024, mode: 0.01011, max: 0.04047, source: "Share of successful injections that are malicious and cause loss (illustrative). Updated 2026-11-22 by calibration 20261122-222415: mitre_atlas 'Data Destruction via Indirect Prompt Injection Targeting Claude Computer-Use' (weak), mode 0.01 → 0.01005. Updated 2026-11-22 by calibration 20261122-222415: mitre_atlas 'Data Exfiltration from Slack AI via Indirect Prompt Injection' (weak), mode 0.01005 → 0.01007. Updated 2026-11-22 by calibration 20261122-222415: mitre_atlas 'Financial Transaction Hijacking with M365 Copilot as an Insider' (weak), mode 0.01007 → 0.01009. Updated 2026-11-22 by calibration 20261122-230406: nvd 'CVE-2026-18883 (prompt injection)' (weak), mode 0.01009 → 0.01011."}
      p_claim_given_harm: {dist: pert, min: 0.001, mode: 0.004, max: 0.012, source: "Share of malicious injections producing a third-party claim (illustrative; cyber analog)."}
    severity:
      body:
        dist: lognormal
        median: {dist: pert, min: 5000, mode: 12000, max: 30000, source: "Fraud loss or incident response cost (illustrative)."}
        p90: {dist: pert, min: 40000, mode: 100000, max: 250000, source: "Illustrative."}
      tail:
        prob: {dist: pert, min: 0.005, mode: 0.02, max: 0.05, source: "Share becoming large breaches (illustrative)."}
        threshold: 500000
        alpha: {dist: pert, min: 1.3, mode: 1.8, max: 2.5, source: "Illustrative."}

  # ---------------------------------------------------------------- profile-priced perils
  bias_discrimination:
    description: Biased automated decisions (hiring, lending, eligibility, pricing) lead to individual or class discrimination claims.
    frequency:
      mode: annual_rate
      rate: {dist: pert, min: 0.002, mode: 0.008, max: 0.03, source: "Employment practices analog, AI-specific share (illustrative)."}
    severity:
      body:
        dist: lognormal
        median: {dist: pert, min: 75000, mode: 150000, max: 350000, source: "EPL analog (illustrative)."}
        p90: {dist: pert, min: 400000, mode: 800000, max: 1800000, source: "EPL analog (illustrative)."}

  ip_infringement:
    description: Generated text, images, or code infringe third-party copyright or trademark.
    frequency:
      mode: annual_rate
      rate: {dist: pert, min: 0.002, mode: 0.006, max: 0.02, source: "Media liability analog (illustrative)."}
    severity:
      body:
        dist: lognormal
        median: {dist: pert, min: 20000, mode: 50000, max: 120000, source: "Media liability analog (illustrative)."}
        p90: {dist: pert, min: 150000, mode: 300000, max: 700000, source: "Illustrative."}

  harmful_content:
    description: Toxic, defamatory, or offensive output about a person or business causes a defamation or harassment claim and reputational response costs.
    frequency:
      mode: annual_rate
      rate: {dist: pert, min: 0.002, mode: 0.006, max: 0.02, source: "Media/defamation analog for public-facing generators (illustrative)."}
    severity:
      body:
        dist: lognormal
        median: {dist: pert, min: 15000, mode: 40000, max: 100000, source: "Defamation defense and settlement (illustrative)."}
        p90: {dist: pert, min: 100000, mode: 250000, max: 600000, source: "Illustrative."}

  unsafe_advice:
    description: Medical, financial, legal, or safety advice that a user relies on causes bodily or financial harm.
    frequency:
      mode: annual_rate
      rate: {dist: pert, min: 0.001, mode: 0.004, max: 0.015, source: "Professional liability analog for advice tools (illustrative)."}
    severity:
      body:
        dist: lognormal
        median: {dist: pert, min: 30000, mode: 80000, max: 200000, source: "Professional liability analog (illustrative)."}
        p90: {dist: pert, min: 250000, mode: 600000, max: 1500000, source: "Illustrative."}

# Correlated failure across insureds that share an underlying model provider
# (bad model update, new jailbreak technique, adverse court ruling).
systemic:
  annual_prob: {dist: pert, min: 0.01002, mode: 0.03007, max: 0.1002, source: "Scenario workshop (illustrative). Updated 2026-11-22 by calibration 20261122-222415: mitre_atlas 'Code to Deploy Destructive AI Agent Discovered in Amazon Q VS Code Extension' (weak), mode 0.03 → 0.03007."}
  share_affected: {dist: pert, min: 0.10, mode: 0.30, max: 0.70, source: Share of a provider's insureds hit in an event (illustrative).}
  burst_multiple: {dist: pert, min: 1.2, mode: 2.5, max: 5.0, source: "Loss per affected policy as a multiple of its normal expected annual loss: a provider-wide failure produces a burst of ordinary claims (illustrative)."}

simulation:
  n_outer: 2000      # parameter-uncertainty draws
  n_inner: 200       # simulated years per parameter draw
  seed: 42
